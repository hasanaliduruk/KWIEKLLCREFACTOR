name: Cross-Platform Python Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Stable Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgirepository1.0-dev libcairo2-dev gir1.2-gtk-3.0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install maturin

    - name: Compile and Install Rust Core
      run: maturin develop --release --manifest-path rust_core/Cargo.toml

    - name: Install macOS specific Webview dependencies
      if: runner.os == 'macOS'
      run: pip install pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-WebKit

    - name: Build with PyInstaller (All Platforms)
      run: pyinstaller build_webview.spec --clean
    
    - name: Copy Settings Folder to Dist (Linux & macOS)
      if: runner.os != 'Windows'
      run: cp -r Settings dist/OperationsToolkit_Webview/

    - name: Copy Settings Folder to Dist (Windows)
      if: runner.os == 'Windows'
      run: xcopy Settings dist\OperationsToolkit_Webview\Settings\ /E /I /H /Y

    - name: Compile Inno Setup Installer (Windows)
      if: runner.os == 'Windows'
      run: iscc installer.iss

    - name: Archive Build (Linux)
      if: runner.os == 'Linux'
      run: |
        cd dist
        tar -czvf OperationsToolkit-Linux.tar.gz OperationsToolkit_Webview

    - name: Package Build (macOS DMG)
      if: runner.os == 'macOS'
      run: |
        cd dist
        hdiutil create -volname "OperationsToolkit" -srcfolder "OperationsToolkit_Webview.app" -ov -format UDZO OperationsToolkit-macOS.dmg

    - name: Publish Windows Release
      if: runner.os == 'Windows'
      uses: softprops/action-gh-release@v2
      with:
        files: Output/OperationsToolkit_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish Linux Release
      if: runner.os == 'Linux'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/OperationsToolkit-Linux.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish macOS Release
      if: runner.os == 'macOS'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/OperationsToolkit-macOS.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}